# Auslieferung: statische Dateien hinter nginx.
#
# - Die Anwendung ist eine Seite; SvelteKit legt mit adapter-static eine
#   Startseite und eine 404.html ab. Unbekannte Wege zeigen auf die Startseite.
# - Startseite NICHT zwischenspeichern (nach einer neuen Fassung soll die alte
#   nicht liegen bleiben), die gehashten Bündel schon.
# - Kreuzherkunft-Isolation (COOP/COEP): das Werkzeug arbeitet mit einer
#   Klangmaschine (Tone.js) und ist damit für gemeinsamen Speicher gerüstet;
#   es gibt keine fremden Bestandteile, die daran scheitern könnten.
# - Content-Security-Policy verbietet Fremdaufrufe: nur eigene Dateien, Blob-
#   und Daten-Adressen. connect-src 'self' heisst: kein Server ausser unserem.
#   ACHTUNG, nginx-Falle: eine eigene add_header-Zeile in einem location-Block
#   SCHALTET die geerbten add_header-Zeilen ab. Deshalb hier kein add_header in
#   den locations — sonst fällt die CSP genau auf der Startseite weg.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/javascript;
    # Klang und Bild nicht nochmals packen: bereits verdichtet.
    gzip_proxied any;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /gesundheit {
        return 200 "ok\n";
    }

    # Startseite: immer beim Server fragen.
    location = /index.html {
        expires -1;
    }

    # Gehashte Bündel-Dateien: ein Jahr zwischenspeichern ist unbedenklich.
    location ~* ^/_app/immutable/ {
        expires 1y;
    }

    # Klänge, Schrift, Beispielvideo: unveränderliche Namen, lange zwischenspeichern.
    # (Kein {n}-Zähler im Muster: nginx verlangt dafür ein Anführungszeichen um
    #  den ganzen Ausdruck. Einfacher ist ein Muster ohne Zähler.)
    location ~* ^/audio/ {
        expires 30d;
    }

    location ~* \.(mp3|mp4|png|ttf|svg|woff2?)$ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
}
